name: Deploy Complete Site to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build Main Site & NFC Verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python CI Dependencies
        run: python3 -m pip install -r scripts/requirements-ci.txt

      - name: Run Secret Scanner
        run: python3 scripts/scan_for_secrets.py

      - name: Run Public Files Verifier
        run: python3 scripts/verify_public_files.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Main ABBO APS Site
        run: |
          npm ci
          npm run build

      - name: Build Static NFC Verifiers (/nfc/ & /tessera/)
        run: |
          cd site
          npm ci
          npm run test
          VITE_BASE_URL=/ npm run build

      - name: Integrate NFC Verifiers into dist/nfc/ and dist/tessera/
        run: |
          mkdir -p dist/nfc dist/tessera
          cp -r site/dist/index.html dist/nfc/index.html
          cp -r site/dist/assets dist/nfc/ 2>/dev/null || true
          if [ -d "site/dist/tessera" ]; then
            cp -r site/dist/tessera/* dist/tessera/
            cp -r site/dist/assets dist/tessera/ 2>/dev/null || true
          fi

      - name: Verify No Source Maps In Production
        run: |
          if find dist -name "*.map" | grep -q .; then
            echo "❌ ERRORE: Trovati file .map di source map in dist!"
            exit 1
          fi
          echo "✅ Build unificata verificata pulita senza source maps."

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
